services:
  - type: web
    name: jawad8-peopleops-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dashboard/
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: jawad8-peopleops-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://peopleops-hrms.vercel.app
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
