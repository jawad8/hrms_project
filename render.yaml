services:
  - type: web
    name: peopleops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dashboard/
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: peopleops-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://peopleops-hrms.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: peopleops-hrms
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://peopleops-api.onrender.com/api
