services:
  - type: web
    name: jawad8-peopleops-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dashboard/
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: jawad8-peopleops-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://jawad8-peopleops-hrms.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: jawad8-peopleops-hrms
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://jawad8-peopleops-api.onrender.com/api
